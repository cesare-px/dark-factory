# Built-in per-model USD pricing, in dollars per MILLION tokens (MTok).
#
# Sources (verified at write time, see _meta.updated):
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#   OpenAI:    https://developers.openai.com/api/docs/pricing
#
# Keys are "<provider>:<model>". Model ids are matched after normalization
# (see pricing/__init__.py:normalize_model_id) which strips a trailing
# "-YYYYMMDD" date suffix, so "claude-sonnet-5-20260215" matches
# "anthropic:claude-sonnet-5" here without needing every dated snapshot
# listed explicitly.
#
# openai_compatible, ollama, and mock are NOT priced here -- they default to
# $0/$0 in code (pricing/__init__.py) because a self-hosted endpoint has no
# per-token API cost. A paid provider with no entry here is a hard error by
# default (see PricingSettings.on_unknown_model) so the budget ceiling never
# silently fails open.

