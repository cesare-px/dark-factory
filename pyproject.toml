[project]
name = "dark-factory"
version = "0.1.0"
description = "Central orchestrator core for the Dark Software Factory pipeline"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[project.scripts]
dark-factory = "dark_factory.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["dark_factory"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dark_factory = ["pricing/prices.yml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "D203", # incompatible with D211 (Google convention picks D211)
    "D213", # incompatible with D212 (Google convention picks D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting; requiring docstrings on every test
# function is pure noise. Style/correctness rules still apply.
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Tests are held to a lighter standard than library code: real type errors
# (wrong arg types, undefined names) still fail, but annotation-completeness
# and untyped-call/equality strictness -- pure noise for pytest fixtures,
# parametrize helpers, and monkeypatch -- are relaxed.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
strict_equality = false
